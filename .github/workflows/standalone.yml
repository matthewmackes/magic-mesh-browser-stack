name: standalone-browser-stack

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  admitted-workspace:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.94.0
          components: rustfmt, clippy
      - name: verify standalone boundaries
        run: install-helpers/verify-standalone-workspace.sh
      - name: test admitted workspace
        run: cargo test --workspace --locked
      - name: lint admitted runtime targets
        run: cargo clippy --workspace --lib --locked -- -D warnings
      - name: lint standalone IPC client tests
        run: cargo clippy -p mde-web-preview-client --all-targets --locked -- -D warnings
