# Standalone Browser-stack workspace metadata.
#
# This first root is intentionally limited to the extracted wire contract and
# the already-complete, headless adblock engine. The remaining Browser crates
# stay outside this workspace until their shared dependencies are extracted or
# replaced with explicit contracts; listing them here would make a clean clone
# resolve against missing paths.

[workspace]
resolver = "2"
members = [
    "crates/desktop/mde-web-wire",
    "crates/services/mde-adblock",
]

[workspace.package]
version = "12.1.6"
edition = "2021"
rust-version = "1.85"
license = "GPL-3.0-or-later"
authors = ["Matthew Mackes <matthewmackes@gmail.com>"]
repository = "https://github.com/matthewmackes/magic-mesh-browser-stack"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unused_must_use = "deny"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
unwrap_used = "deny"
panic = "warn"
todo = "deny"
too_many_lines = "allow"
doc_markdown = "allow"
cast_sign_loss = "allow"
cast_possible_wrap = "allow"
missing_const_for_fn = "allow"
